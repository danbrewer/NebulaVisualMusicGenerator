<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nebula</title>
<style>
:root{--kb:120px;--paper:#f4f2ec;--ink:#1b1b1d;--mute:#77746c;--line:#d9d5c9;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:12px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden}
canvas{display:block}
#c{position:fixed;left:0;top:0;width:100%;height:calc(100% - var(--kb))}
#kb{position:fixed;left:0;bottom:0;width:100%;height:var(--kb);background:#efece4;border-top:1px solid var(--line);touch-action:none;cursor:pointer}
.hint{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;color:var(--mute);font-size:13px;pointer-events:none;max-width:360px;line-height:1.5}
.hint b{color:var(--ink)}
.sub{border-top:1px solid var(--line);padding-top:6px}
.sub summary{cursor:pointer;color:var(--ink);letter-spacing:.1em;text-transform:uppercase;font-size:10px;user-select:none}
.sub[open] summary{margin-bottom:7px}
.subBox{display:grid;gap:8px}
.panel{position:fixed;top:14px;right:14px;width:210px;display:grid;gap:9px;padding:12px;background:rgba(244,242,236,.92);border:1px solid var(--line);border-radius:4px;font-size:11px;max-height:calc(100vh - 28px - var(--kb));overflow:auto}
.panel.closed>:not(.hd){display:none}
.hd{display:flex;justify-content:space-between;align-items:center;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);cursor:pointer;user-select:none}
.ctl{display:grid;gap:3px}
.ctl label{display:flex;justify-content:space-between;color:var(--mute)}
.ctl output{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ink);margin:0}
select,input[type=text],button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:2px;padding:5px 8px;width:100%}
button{cursor:pointer}button:hover,button.p{background:var(--ink);color:var(--paper)}
.row{display:flex;gap:6px}.row>*{flex:1;min-width:0}
.vcr{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;align-items:center;background:rgba(244,242,236,.94);border:1px solid var(--line);border-radius:999px;padding:4px 10px;z-index:4;font-size:11px}
.vcr button{width:auto;padding:3px 9px;border-radius:999px;font-size:11px}
.vcr button.on{background:var(--ink);color:var(--paper)}
.vcr input{width:120px;margin:0 4px}
.vcr span{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{color:var(--mute);font-size:10px;letter-spacing:.08em}
.snd{position:fixed;top:14px;left:14px;width:auto;padding:7px 14px;border-radius:999px;z-index:3}
.snd.on{background:var(--ink);color:var(--paper)}
.ends{display:flex;justify-content:space-between;color:var(--mute);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.syn{border:1px solid var(--ink);border-radius:3px;padding:8px 10px}
.syn summary{cursor:pointer;color:var(--ink);font-weight:700;letter-spacing:.14em;text-transform:uppercase;user-select:none}
.syn[open] summary{margin-bottom:9px}
#sy,#svBox{display:grid;gap:8px}
.chk{display:flex;gap:6px;align-items:center}
:focus-visible{outline:2px solid #2a6df4;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="kb" aria-label="Piano keyboard"></canvas>
<div class="hint" id="hint">Press <b>▶</b> to play the progression, or shape the sound first: try <b>Play sample</b> in the Synth box, or play the keyboard below (click, or type A S D F G H J K).</div>
 <div class="vcr" id="vcr">
  <button id="vRestart" title="Back to start">|◀</button><button id="vRw" title="Rewind (4×)">◀◀</button>
  <button id="vPlay" title="Play / pause (space)">❚❚</button><button id="vFf" title="Fast-forward (4×)">▶▶</button>
  <button id="vStop" title="Stop">■</button>
  <input type="range" id="scrub" min="0" max="1" step="0.01" value="0" aria-label="Position">
  <span id="vTime"></span>
</div>
<button class="snd on" id="snd">&#9835; Sound: on</button>
<div class="panel" id="panel">
  <div class="hd" id="hd"><span>Nebula <span class="tag">build 28-Oct preset fix</span></span><span id="tog">–</span></div>
  <div class="row"><button class="p" id="rand">Randomize</button><button id="replay">Replay</button></div>
  <div class="row"><button id="png">Save PNG</button><button id="newseed">New seed</button></div>
  <details class="syn" id="sv" data-sec="sv" open><summary>Save / load</summary><div id="svBox">
    <div class="row"><input type="text" id="svName" placeholder="Name this setup" aria-label="Setup name"><button id="svSave">Save</button></div>
    <div class="row"><select id="svList" aria-label="Saved setups"></select></div>
    <div class="row"><button id="svLoad">Load</button><button id="svDel">Delete</button></div>
    <div class="row"><button id="svExport">Export file</button><button id="svImport">Import file</button></div>
    <input type="file" id="svFile" accept=".json,application/json" hidden>
    <button id="svReset">Reset to defaults</button>
    <div class="tag" id="svMsg">Auto-saved in this browser.</div>
  </div></details>
  <div class="ctl"><label for="seed">Seed</label><input type="text" id="seed"></div>
  <div class="ctl"><label for="prog">Progression</label><select id="prog"></select></div>
  <details class="syn" id="syn" data-sec="syn" open><summary>Synth sound controls</summary><div id="sy">
    <div class="ctl"><label for="preset">Preset</label><select id="preset"></select></div>
    <button id="sample">▶ Play sample</button>
  </div></details>
  <div id="sl" style="display:contents"></div>
  <div class="ctl"><label for="exp">PNG size</label>
    <select id="exp"><option value="1">Screen</option><option value="2" selected>2× screen</option><option value="3">3× screen</option><option value="4k">3840 × 2160</option></select></div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('c'), cx = cv.getContext('2d');

// ---------- music ----------
const NOTE = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
// chord tones as semitones above the root; guide tones (3rd + 7th/6th) always get voiced
const TYPES = {
  maj7: {iv:[0,4,7,11,2,9],  guide:[4,11], name:'maj7'},
  m7:   {iv:[0,3,7,10,2,5],  guide:[3,10], name:'m7'},
  '7':  {iv:[0,4,7,10,2,9],  guide:[4,10], name:'7'},
  m7b5: {iv:[0,3,6,10,5],    guide:[3,10], name:'m7b5'},
  '7alt':{iv:[0,4,8,10,1,3], guide:[4,10], name:'7alt'},
  '7b9':{iv:[0,4,7,10,1,9],  guide:[4,10], name:'7b9'},
  m6:   {iv:[0,3,7,9,2],     guide:[3,9],  name:'m6'},
};
// [semitones above the key's tonic, chord type]
const PROGS = [
  {name:'ii–V–I',                  mode:'major', ch:[[2,'m7'],[7,'7'],[0,'maj7']]},
  {name:'I–vi–ii–V–I',             mode:'major', ch:[[0,'maj7'],[9,'m7'],[2,'m7'],[7,'7'],[0,'maj7']]},
  {name:'iii–VI–ii–V–I',           mode:'major', ch:[[4,'m7'],[9,'7'],[2,'m7'],[7,'7'],[0,'maj7']]},
  {name:'ii–bII7–I (tritone sub)', mode:'major', ch:[[2,'m7'],[1,'7'],[0,'maj7']]},
  {name:'I–iv–bVII7–I (backdoor)', mode:'major', ch:[[0,'maj7'],[5,'m7'],[10,'7'],[0,'maj7']]},
  {name:'ii–V–i (minor)',          mode:'minor', ch:[[2,'m7b5'],[7,'7alt'],[0,'m6']]},
  {name:'i–iv–iiø–V–i',            mode:'minor', ch:[[0,'m7'],[5,'m7'],[2,'m7b5'],[7,'7b9'],[0,'m6']]},
  {name:'Rhythm changes',          mode:'major', ch:[[0,'maj7'],[9,'7'],[2,'m7'],[7,'7'],[0,'maj7'],[0,'7'],[5,'maj7'],[5,'m6'],[4,'m7'],[9,'7'],[2,'m7'],[7,'7'],[0,'maj7']]},
  {name:'Jazz blues',              mode:'major', ch:[[0,'7'],[5,'7'],[0,'7'],[2,'m7'],[7,'7'],[0,'7'],[9,'7'],[2,'m7'],[7,'7'],[0,'maj7']]},
];
$('prog').add(new Option('Auto (from seed)', 'auto'));
PROGS.forEach((p,i)=>$('prog').add(new Option(p.name, i)));
const freq = n => 440 * Math.pow(2, (n - 69) / 12);

// ---------- seed ----------
function hashSeed(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const newSeed = () => Math.random().toString(36).slice(2,8);

// ---------- sliders ----------
const SL = [
  ['voices','Voices',3,10,1,6],
  ['labels','Labelled voices',0,10,1,3],
  ['weight','Line weight',0.5,4,0.1,1.2],
  ['chordLen','Chord length (s)',1.5,6,0.1,3],
  ['form','Opening glide (s)',1,8,0.5,3],
  ['speed','Scroll speed',30,320,5,120],
  ['change','Notes that change',0,1,0.05,0.6],
  ['jump','Max line jump (semitones)',1,48,1,5],
  ['cross','Line crossings per chord change',0,36,1,36],
];
const P = {},OUTS = {};
let started = false, restoring = false;
for (const [k,label,min,max,step,def] of SL) {
  P[k]=def;
  const d=document.createElement('div');d.className='ctl';
  d.innerHTML=`<label for="s_${k}">${label}<output></output></label><input type="range" id="s_${k}" min="${min}" max="${max}" step="${step}" value="${def}">`;
  $('sl').appendChild(d);
  const i=d.querySelector('input'),o=d.querySelector('output');
  const u=()=>{P[k]=+i.value;o.textContent=k==='change'?Math.round(i.value*100)+'%':k==='jump'?i.value+' st':i.value;};
  i.addEventListener('input',()=>{u();build();});
  i.addEventListener('change',()=>{if(['voices','chordLen','form','change','jump','cross'].includes(k))refresh();});
  if(k==='change')d.insertAdjacentHTML('beforeend','<div class="ends"><span>Few</span><span>Many</span></div>');
  if(k==='jump')d.insertAdjacentHTML('beforeend','<div class="ends"><span>Smooth</span><span>Leaps</span></div>');
  if(k==='cross'){d.insertAdjacentHTML('beforeend','<div class="ends"><span>None</span><span>All</span></div>');OUTS.cross=o;}
  u();
}
const setSlider=(k,v)=>{const i=$('s_'+k);i.value=v;i.dispatchEvent(new Event('input'));};

// ---------- synth controls ----------
const cutHz=()=>200*Math.pow(80,P.cutoff);
const kfmt=v=>v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)+'';
// key,label,min,max,step,default,live?(false = rebuild/replay on release)
const SYN=[
  ['harm','Overtone (octave up)',0,1,0.05,0.2,true],
  ['detune','Unison detune (cents)',0,40,1,9,true],
  ['cutoff','Filter cutoff',0,1,0.01,0.5,true],
  ['reso','Filter resonance',0.1,12,0.1,0.4,true],
  ['vibRate','Vibrato rate (Hz)',0.5,10,0.1,4.5,true],
  ['vibDepth','Vibrato depth (cents)',0,60,1,3,true],
  ['sub','Sub octave',0,1,0.05,0.15,true],
  ['sweep','Filter sweep depth',0,1,0.05,0.1,true],
  ['sweepRate','Filter sweep rate (Hz)',0.05,4,0.05,0.1,true],
  ['reverb','Reverb',0,1,0.05,0.5,true],
  ['bass','Bass level',0,2,0.05,0.9,true],
  ['vol','Volume',0,1,0.05,0.8,true],
  ['attack','Attack (s)',0.005,4,0.005,1.4,false],
  ['decay','Decay time, struck (s)',0.3,8,0.1,2.5,false],
  ['bright','Strike brightness',0,1,0.05,0.5,false],
  ['strum','Strum spread (ms)',0,400,5,15,false],
  ['pulse','Dot pulse size',0,4,0.1,1.8,true],
  ['release','Release / fade (s)',0.2,5,0.1,3,false],
  ['glideLen','Glide length (s)',0.1,3,0.1,0.6,false],
];
const SELS={mode:['sustain','struck'],wave:['sine','triangle','sawtooth','square'],restrike:['yes','no'],glideShape:['smooth','linear','quick']};
const SELLABEL={mode:'Note style (sustain / struck)',wave:'Waveform',restrike:'Re-strike common tones',glideShape:'Glide shape'};
const SYN_DEF={mode:'sustain',wave:'triangle',restrike:'yes',glideShape:'smooth'};
const CLASSIC={
  'Genesis – Tony Banks string pad':{wave:'sawtooth',harm:.3,detune:14,cutoff:.62,reso:.8,vibRate:5,vibDepth:4,reverb:.6,bass:1,attack:1.4,release:3,glideLen:1.6,glideShape:'smooth',sweep:.1,sweepRate:.15},
  'Yes – Wakeman Moog lead':{wave:'sawtooth',harm:.1,detune:0,cutoff:.7,reso:3.5,vibRate:5.5,vibDepth:10,reverb:.25,bass:1,attack:.05,release:.5,glideLen:.8,glideShape:'smooth',sub:.5},
  'Rush – Oberheim brass':{wave:'sawtooth',harm:.2,detune:12,cutoff:.68,reso:2,reverb:.2,bass:1,attack:.12,release:.8,glideLen:.5,glideShape:'quick',sub:.3,sweep:.15,sweepRate:.25},
  'Rush – Moog bass (Tom Sawyer)':{wave:'sawtooth',harm:.1,detune:4,cutoff:.5,reso:5,reverb:.1,bass:1.8,attack:.05,release:.6,glideLen:.4,glideShape:'quick',sub:.8},
  'Duran Duran – bright pad (Rio)':{wave:'sawtooth',harm:.5,detune:18,cutoff:.85,reso:.6,reverb:.55,bass:1,attack:.5,release:2,glideLen:1,glideShape:'smooth',sweep:.1,sweepRate:.2},
  'Flock of Seagulls – icy chorus':{wave:'sawtooth',harm:.6,detune:22,cutoff:.72,reso:1.5,vibRate:5,vibDepth:6,reverb:.75,bass:.9,attack:.8,release:3,glideLen:1.3,glideShape:'smooth',sweep:.25,sweepRate:.4},
  'a-ha – Take On Me lead':{wave:'square',harm:.3,detune:8,cutoff:.9,reso:1,reverb:.3,bass:1.2,attack:.02,release:.3,glideLen:.3,glideShape:'quick',sub:.2},
  'Van Halen – Jump brass':{wave:'sawtooth',harm:.25,detune:15,cutoff:.78,reso:1.2,reverb:.2,bass:1,attack:.03,release:.5,glideLen:.3,glideShape:'quick',sub:.2},
  'Journey – Separate Ways lead':{wave:'sawtooth',harm:.4,detune:20,cutoff:.85,reso:1,reverb:.35,bass:1.1,attack:.04,release:.8,glideLen:.4,glideShape:'quick',sub:.3},
  'Depeche Mode – cold bell':{wave:'square',harm:.8,detune:2,cutoff:.55,reso:4,reverb:.5,bass:.6,attack:.02,release:1.5,glideLen:.3,glideShape:'quick'},
  'Kraftwerk – sequencer pulse':{wave:'square',harm:.4,detune:0,cutoff:.6,reso:6,reverb:.15,bass:1.3,attack:.03,release:.35,glideLen:.2,glideShape:'quick',sub:.6,sweep:.35,sweepRate:.8},
  'Tangerine Dream – drifting sweep':{wave:'sawtooth',harm:.2,detune:10,cutoff:.5,reso:7,reverb:.8,bass:1,attack:2,release:4,glideLen:1.8,glideShape:'smooth',sub:.3,sweep:.8,sweepRate:.1},
  'Jarre – Oxygène wobble':{wave:'triangle',harm:.5,detune:6,cutoff:.8,reso:2,vibRate:4.5,vibDepth:18,reverb:.6,bass:1,attack:.4,release:2.5,glideLen:1.2,glideShape:'smooth',sweep:.3,sweepRate:.2},
  'Vangelis – Blade Runner brass':{wave:'sawtooth',harm:.3,detune:16,cutoff:.64,reso:1.5,reverb:.7,bass:1,attack:.6,release:3,glideLen:1.2,glideShape:'smooth',sub:.4,sweep:.1,sweepRate:.15},
  'Gary Numan – Cars drone':{wave:'sawtooth',harm:.2,detune:6,cutoff:.55,reso:2,reverb:.2,bass:1.5,attack:.03,release:.4,glideLen:.3,glideShape:'quick',sub:.9},
};
const INSTR={
  'Grand piano':{mode:'struck',wave:'triangle',harm:.55,detune:2,cutoff:.9,reso:.6,reverb:.35,attack:.005,decay:3.5,bright:.6,strum:18,bass:1,sub:.1},
  'Electric piano (Rhodes)':{mode:'struck',wave:'sine',harm:.6,detune:4,cutoff:.9,reso:.6,vibRate:4.5,vibDepth:4,reverb:.3,attack:.008,decay:2.2,bright:.7,strum:12,bass:1},
  'Vibraphone':{mode:'struck',wave:'sine',harm:.35,detune:1,cutoff:1,reso:.5,vibRate:5.5,vibDepth:8,reverb:.5,attack:.004,decay:4.5,bright:.2,strum:6,bass:.8},
  'Harp (rolled chords)':{mode:'struck',wave:'triangle',harm:.4,detune:1,cutoff:.9,reso:.6,reverb:.5,attack:.003,decay:3,bright:.5,strum:220,bass:.8},
  'Nylon guitar pluck':{mode:'struck',wave:'triangle',harm:.3,detune:2,cutoff:.8,reso:1,reverb:.25,attack:.002,decay:1.2,bright:.8,strum:90,bass:1.1},
  'Celesta / music box':{mode:'struck',wave:'sine',harm:.9,detune:0,cutoff:1,reso:.5,reverb:.6,attack:.002,decay:2,bright:.3,strum:30,bass:.4},
  'Marimba':{mode:'struck',wave:'sine',harm:.25,detune:0,cutoff:.8,reso:.5,reverb:.2,attack:.003,decay:.9,bright:.3,strum:10,bass:1.3,sub:.3},
};
const PRESETS={
  'Warm pad (default)':{wave:'triangle',harm:.2,detune:9,cutoff:.5,reso:.4,vibRate:4.5,vibDepth:3,sub:.15,sweep:.1,sweepRate:.1,reverb:.5,bass:.9,vol:.8,attack:1.4,release:3,glideLen:.6,glideShape:'smooth'},
  'Clean sine':{wave:'sine',harm:.25,detune:0,cutoff:1,reso:.7,vibDepth:0,reverb:.25,bass:1,vol:.8,attack:.3,release:1.2,glideLen:1,glideShape:'smooth'},
  'Soft pad':{wave:'triangle',harm:.3,detune:8,cutoff:.72,reso:.7,vibDepth:0,reverb:.55,bass:1,vol:.8,attack:1.2,release:2.5,glideLen:1.5,glideShape:'smooth'},
  'Organ':{wave:'square',harm:.8,detune:0,cutoff:.7,reso:.5,vibRate:6,vibDepth:8,reverb:.15,bass:1.2,vol:.8,attack:.08,release:.3,glideLen:.4,glideShape:'quick'},
  'Glass':{wave:'sine',harm:.9,detune:3,cutoff:1,reso:.7,vibRate:5.5,vibDepth:6,reverb:.7,bass:.5,vol:.8,attack:.1,release:3,glideLen:1,glideShape:'smooth'},
  'Bass-heavy':{wave:'sawtooth',harm:.2,detune:12,cutoff:.45,reso:3,vibDepth:0,reverb:.2,bass:1.8,vol:.8,attack:.1,release:1,glideLen:.8,glideShape:'smooth'},
};
$('preset').add(new Option('Custom','custom'));
{const g1=document.createElement('optgroup');g1.label='Basic';for(const k in PRESETS)g1.appendChild(new Option(k,k));$('preset').appendChild(g1);
 const g3=document.createElement('optgroup');g3.label='Struck instruments (attack + decay)';for(const k in INSTR)g3.appendChild(new Option(k,k));$('preset').appendChild(g3);
 const g2=document.createElement('optgroup');g2.label='70s & 80s classics';for(const k in CLASSIC)g2.appendChild(new Option(k,k));$('preset').appendChild(g2);}
Object.assign(P,SYN_DEF);
const synBox=$('sy');
const SECTIONS=[['style','Note style',['mode','restrike']],['osc','Oscillator',['wave','harm','sub','detune']],['filter','Filter',['cutoff','reso','sweep','sweepRate']],
  ['vib','Vibrato',['vibRate','vibDepth']],['env','Envelope',['attack','release','decay','bright','strum']],['glide','Glide',['glideShape','glideLen']],
  ['mix','Mix & space',['reverb','bass','vol']],['disp','Display',['pulse']]];
const SEC_OPEN={syn:true,sv:true,style:true,osc:true,filter:false,vib:false,env:true,glide:false,mix:true,disp:false};
const secBox={};
for(const [id,title] of SECTIONS){
  const d=document.createElement('details');d.className='sub';d.dataset.sec=id;d.open=SEC_OPEN[id];
  d.innerHTML=`<summary>${title}</summary><div class="subBox"></div>`;synBox.appendChild(d);secBox[id]=d.querySelector('.subBox');
}
const boxOf=k=>secBox[SECTIONS.find(x=>x[2].includes(k))[0]];
// The preset dropdown always reflects the actual settings: it shows a preset whenever every value that preset sets
// matches (sliders snap to their step, so values are compared after snapping), otherwise "Custom".
const PRESET_BASE={mode:'sustain',restrike:'yes',decay:2.5,bright:.5,strum:15,pulse:1.8,vibRate:5,vibDepth:0,sub:0,sweep:0,sweepRate:.3,vol:.8,harm:.25,detune:0,cutoff:1,reso:.7,reverb:.25,bass:1,attack:.3,release:1.2};
const SYNMETA={};for(const [k,,min,max,step] of SYN)SYNMETA[k]=[min,step,max];
const presetValues=n=>{const pr=PRESETS[n]||CLASSIC[n]||INSTR[n];return pr?Object.assign({},PRESET_BASE,pr):null;};
const snap=(k,v)=>{const m=SYNMETA[k];if(!m||typeof v!=='number')return v;v=Math.min(m[2],Math.max(m[0],v));return +(m[0]+Math.round((v-m[0])/m[1])*m[1]).toFixed(4);};
function syncPreset(){
  for(const n of [...Object.keys(PRESETS),...Object.keys(CLASSIC),...Object.keys(INSTR)]){
    const full=presetValues(n);
    if(Object.keys(full).every(k=>typeof full[k]==='number'?Math.abs(snap(k,full[k])-P[k])<1e-3:P[k]===full[k])){$('preset').value=n;return n;}
  }
  $('preset').value='custom';return 'custom';
}
const touch=syncPreset;
for(const k in SELS){
  const d=document.createElement('div');d.className='ctl';
  d.innerHTML=`<label for="s_${k}">${SELLABEL[k]}</label><select id="s_${k}">${SELS[k].map(o=>`<option value="${o}">${o}</option>`).join('')}</select>`;
  boxOf(k).appendChild(d);
  d.querySelector('select').addEventListener('change',e=>{
    P[k]=e.target.value;touch();
    if(k==='glideShape'||k==='mode'||k==='restrike'){build();if(!restoring)refresh();}else applySynth();
    writeHash();
  });
}
for(const [k,label,min,max,step,def,live] of SYN){
  P[k]=def;
  const d=document.createElement('div');d.className='ctl';
  d.innerHTML=`<label for="s_${k}">${label}<output></output></label><input type="range" id="s_${k}" min="${min}" max="${max}" step="${step}" value="${def}">`;
  boxOf(k).appendChild(d);
  const i=d.querySelector('input'),o=d.querySelector('output');
  const u=()=>{P[k]=+i.value;o.textContent=k==='cutoff'?kfmt(cutHz())+' Hz':i.value;};
  i.addEventListener('input',()=>{u();touch();if(['glideLen','decay','strum'].includes(k))build();applySynth();writeHash();});
  i.addEventListener('change',()=>{if(['attack','release','glideLen','decay','bright','strum'].includes(k))refresh();});
  u();
}
function setSyn(k,v){
  const el=$('s_'+k);if(!el)return;
  el.value=v;el.dispatchEvent(new Event(el.tagName==='SELECT'?'change':'input'));
}
function applyPreset(name){
  const full=presetValues(name);if(!full)return;
  for(const k in full)setSyn(k,snap(k,full[k]));   // snapped to the slider step, so what is applied is exactly what is compared
  build();applySynth();syncPreset();writeHash();refresh();
}
$('preset').addEventListener('change',e=>{if(e.target.value!=='custom')applyPreset(e.target.value);});
// ---------- save / load ----------
const AUTOSAVE='nebula.config.v1',SAVED='nebula.saved.v1';
const DEFAULTS=Object.assign({},SYN_DEF);
for(const [k,,,,,d] of SL)DEFAULTS[k]=d;
for(const [k,,,,,d] of SYN)DEFAULTS[k]=d;
function getConfig(){
  return {app:'nebula',version:1,saved:new Date().toISOString(),seed:$('seed').value,prog:$('prog').value,preset:$('preset').value,params:Object.assign({},P)};
}
function applyConfig(cfg,replayNow=true){
  if(!cfg||typeof cfg!=='object')throw new Error('not a Nebula setup');
  const pr=cfg.params&&typeof cfg.params==='object'?cfg.params:{};
  restoring=true;
  try{
    if(cfg.seed!=null)$('seed').value=String(cfg.seed).slice(0,40);
    if(cfg.prog!=null&&[...$('prog').options].some(o=>o.value===String(cfg.prog)))$('prog').value=String(cfg.prog);
    for(const [k] of SL)if(k in pr&&isFinite(+pr[k]))setSlider(k,+pr[k]);
    for(const [k] of SYN)if(k in pr&&isFinite(+pr[k]))setSyn(k,+pr[k]);
    for(const k in SELS)if(SELS[k].includes(pr[k]))setSyn(k,pr[k]);
  }finally{restoring=false;}
  build();
  syncPreset();
  applySynth();writeHash();
  if(replayNow)refresh();
}
const svMsg=t=>{$('svMsg').textContent=t;};
const loadSaved=()=>{try{return JSON.parse(localStorage.getItem(SAVED)||'{}')||{};}catch(e){return {};}};
function refreshSaved(){
  const l=$('svList'),cur=l.value;l.innerHTML='';l.add(new Option('— saved setups —',''));
  Object.keys(loadSaved()).sort().forEach(n=>l.add(new Option(n,n)));
  if([...l.options].some(o=>o.value===cur))l.value=cur;
}
$('svSave').onclick=()=>{
  const name=$('svName').value.trim();if(!name){svMsg('Type a name first.');return;}
  try{const all=loadSaved();all[name]=getConfig();localStorage.setItem(SAVED,JSON.stringify(all));refreshSaved();$('svList').value=name;svMsg('Saved "'+name+'".');}
  catch(e){svMsg('Could not save (browser storage unavailable).');}
};
$('svLoad').onclick=()=>{
  const n=$('svList').value,c=loadSaved()[n];if(!c){svMsg('Pick a saved setup first.');return;}
  try{applyConfig(c);$('svName').value=n;svMsg('Loaded "'+n+'".');}catch(e){svMsg('Could not load: '+e.message);}
};
$('svDel').onclick=()=>{
  const n=$('svList').value;if(!n){svMsg('Pick a saved setup first.');return;}
  if(!confirm('Delete saved setup "'+n+'"?'))return;
  try{const all=loadSaved();delete all[n];localStorage.setItem(SAVED,JSON.stringify(all));refreshSaved();svMsg('Deleted "'+n+'".');}catch(e){svMsg('Could not delete.');}
};
$('svExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(getConfig(),null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='nebula-config-'+($('seed').value||'x')+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);svMsg('Exported '+a.download+'.');
};
$('svImport').onclick=()=>$('svFile').click();
$('svFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{applyConfig(JSON.parse(r.result));svMsg('Imported '+f.name+'.');}catch(err){svMsg('Could not import: '+err.message);}};
  r.onerror=()=>svMsg('Could not read that file.');
  r.readAsText(f);e.target.value='';
});
$('svReset').onclick=()=>{
  if(!confirm('Reset all settings to defaults? (The seed is kept.)'))return;
  applyConfig({seed:$('seed').value,prog:'auto',params:DEFAULTS});
  syncPreset();svMsg('Reset to defaults.');
};
refreshSaved();
// Saving is debounced: applying a preset changes ~20 controls at once, and browsers refuse history.replaceState
// calls beyond ~200 per 10 s, which used to leave the URL (and so a reload) one preset behind.
let saveTimer=null;
function flushSave(){
  clearTimeout(saveTimer);saveTimer=null;
  try{localStorage.setItem(AUTOSAVE,JSON.stringify(getConfig()));}catch(e){}
  try{const q=new URLSearchParams({seed:$('seed').value||'x',prog:$('prog').value});for(const k in P)q.set(k,P[k]);history.replaceState(null,'','#'+q);}catch(e){}
}
function writeHash(){
  if(restoring)return;
  clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,120);
}
addEventListener('pagehide',()=>{if(saveTimer)flushSave();});
addEventListener('beforeunload',()=>{if(saveTimer)flushSave();});

// ---------- scene: key, progression, voice leading ----------
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const GL={smooth:ease,linear:t=>t,quick:t=>1-Math.pow(1-t,3)};
let S = null;
function build() {
  const seedStr = $('seed').value || 'x', seedNum = hashSeed(seedStr), r = mulberry(seedNum);
  const key = Math.floor(r()*12);
  const CALM=PROGS.map((p,i)=>i).filter(i=>PROGS[i].mode==='major');   // 'auto' sticks to the gentle major-key progressions
  const sel = $('prog').value, auto = CALM[Math.floor(r()*CALM.length)];
  const prog = PROGS[sel==='auto' ? auto : +sel];
  const chords = prog.ch.map(([off,type])=>{
    const root=(key+off)%12;return {root,type,name:NOTE[root]+TYPES[type].name};
  });
  const K = P.voices, n = chords.length;
  const maxPairs=(K-1)*(K-2)/2;
  if(OUTS.cross)OUTS.cross.textContent=P.cross>=maxPairs?'All':String(P.cross);
  const m = Array.from({length:K},()=>[]);
  // bass: chord root, nearest to the previous bass note
  let pb = 41;
  for (const c of chords) {
    let best=null;
    for (let x=36;x<=47;x++) if (x%12===c.root && (best===null||Math.abs(x-pb)<Math.abs(best-pb))) best=x;
    m[0].push(best);pb=best;
  }
  // upper voices. Common tones may hold; how many of them are made to move is set by the Few–Many
  // slider. Voices whose note doesn't belong to the new chord must always move, and the 3rd/7th
  // are always covered. Everything that moves takes the smallest step.
  const r2=mulberry(seedNum^0x9e3779b9);
  let prev = Array.from({length:K-1},(_,j)=>57+Math.round(j*20/Math.max(1,K-2)));
  chords.forEach((c,ci)=>{
    const T=TYPES[c.type],pool=[];
    const valid=x=>T.iv.some(i=>(i+c.root)%12===x%12);
    const lowest=Math.max(55,m[0][ci]+7);   // keep clear of the bass: no muddy low intervals
    for (let x=lowest;x<=79;x++) if (valid(x)) pool.push(x);
    const asg=new Array(K-1).fill(null),used=new Set(),moving=new Set();
    if(ci===0){prev.forEach((_,j)=>moving.add(j));}
    else{
      const hold=[];
      prev.forEach((x,j)=>{if(valid(x))hold.push(j);else moving.add(j);});
      // choose, in seeded order, which of the voices that could hold are made to move anyway
      const order=hold.slice();for(let i=order.length-1;i>0;i--){const k=Math.floor(r2()*(i+1));[order[i],order[k]]=[order[k],order[i]];}
      const extra=Math.round(P.change*hold.length);
      order.forEach((j,i)=>{if(i<extra)moving.add(j);});
      prev.forEach((x,j)=>{if(!moving.has(j)){asg[j]=x;used.add(x);}});
    }
    // Max line jump: a moving line may only land within P.jump semitones of where it was. Above a small jump the
    // choice also gets a seeded random nudge, so with a big jump a line can leap anywhere in the register.
    const nz=new Map(),noise=(j,x)=>{const k=j*100+x;if(!nz.has(k))nz.set(k,Math.max(0,P.jump-2)*r2());return nz.get(k);};
    // mode bits: 1 = respect the max line jump, 2 = keep at least 3 semitones from the other upper notes (no clusters)
    const assign=(filter,js,mode)=>{
      let bj=-1,bn=null,bc=1e9;
      for (const j of js) if(asg[j]===null) for (const x of pool) if(!used.has(x)&&filter(x)){
        const dd=Math.abs(prev[j]-x);if((mode&1)&&dd>P.jump)continue;
        if((mode&2)&&asg.some(y=>y!==null&&Math.abs(y-x)<3))continue;
        const cst=dd+noise(j,x)+(x===prev[j]?1000:0);   // a voice picked to move should actually move
        if(cst<bc){bc=cst;bj=j;bn=x;}
      }
      if(bj>=0){asg[bj]=bn;used.add(bn);}
      return bj>=0;
    };
    // make sure the guide tones are sounding; if every voice is holding, release the nearest one
    for (const g of T.guide) {
      const gp=(g+c.root)%12;
      if (asg.some(x=>x!==null&&x%12===gp)) continue;
      if (![...moving].some(j=>asg[j]===null)) {
        let bj=-1,bc=1e9;
        asg.forEach((x,j)=>{if(x===null)return;for(const y of pool)if(y%12===gp&&!used.has(y)&&Math.abs(x-y)<bc){bc=Math.abs(x-y);bj=j;}});
        if(bj>=0){used.delete(asg[bj]);asg[bj]=null;moving.add(bj);}
      }
      {const f=x=>x%12===gp,mv=[...moving];[3,1,2,0].some(md=>assign(f,mv,md));}
    }
    const js=[...moving];
    while (js.some(j=>asg[j]===null) && [3,1,2,0].some(md=>assign(()=>true,js,md))) {}
    asg.forEach((v,j)=>{if(v===null)asg[j]=prev[j];});   // safety net
    // Line crossings: count the pairs of upper lines whose order flips at this chord change, and if that is more than
    // allowed, swap the targets of moving lines (within the jump limit first, then ignoring it), and as a last resort
    // hand the notes out in the lines' existing order, which can never cross.
    if(ci>0&&P.cross<maxPairs){
      const inv=(a,b)=>{let c=0;for(let j=0;j<a.length;j++)for(let l=j+1;l<a.length;l++)if((a[j]-a[l])*(b[j]-b[l])<0)c++;return c;};
      const mv=[...moving];
      for(const respectJump of [true,false]){
        for(let guard=0;guard<200&&inv(prev,asg)>P.cross;guard++){
          const cur=inv(prev,asg);let best=null,bc=cur,bm=1e9;
          for(let a=0;a<mv.length;a++)for(let b=a+1;b<mv.length;b++){
            const j=mv[a],l=mv[b],t=asg.slice();[t[j],t[l]]=[t[l],t[j]];
            if(respectJump&&(Math.abs(t[j]-prev[j])>P.jump||Math.abs(t[l]-prev[l])>P.jump))continue;
            const c=inv(prev,t),mvd=Math.abs(t[j]-prev[j])+Math.abs(t[l]-prev[l]);
            if(c<bc||(c===bc&&c<cur&&mvd<bm)){best=t;bc=c;bm=mvd;}
          }
          if(!best)break;
          asg.splice(0,asg.length,...best);
        }
      }
      if(inv(prev,asg)>P.cross){
        const notes=asg.slice().sort((a,b)=>a-b),order=prev.map((x,j)=>j).sort((a,b)=>prev[a]-prev[b]);
        order.forEach((j,r)=>{asg[j]=notes[r];});
      }
    }
    asg.forEach((v,j)=>m[j+1].push(v));
    prev=asg;
  });
  const all=m.flat(),lo=Math.min(...all),hi=Math.max(...all),f0=(lo+hi)/2;
  const voices=m.map(ms=>({m:ms,fk:0.7+0.3*r()}));
  // labelled voices spread through the register (bass, middle, top)
  const L=Math.min(P.labels,K),lab=new Set();
  for(let i=0;i<L;i++)lab.add(L===1?0:Math.round(i*(K-1)/(L-1)));
  voices.forEach((v,i)=>v.label=lab.has(i));
  const fd=P.form,cd=P.chordLen,g=P.mode==='struck'?Math.min(.06,cd):Math.min(P.glideLen,cd);
  S={voices,chords,prog,key,seedNum,lo,hi,f0,fd,cd,g,n,end:fd+n*cd,shape:P.mode==='struck'?(t=>t):(GL[P.glideShape]||ease),struck:P.mode==='struck'};
  S.strikes=voices.map(()=>[]);
  if(S.struck){
    const r3=mulberry(seedNum^0x51ed270b),T60=P.decay,atk=Math.max(.003,P.attack);
    voices.forEach((v,vi)=>{
      for(let i=0;i<n;i++){
        const note=v.m[i];
        if(i>0&&P.restrike==='no'&&note===v.m[i-1])continue;
        const t=fd+i*cd+(K>1?P.strum/1000*vi/(K-1):0);
        const tau=T60/6.9*Math.min(2.2,Math.max(.5,Math.pow(2,(60-note)/36)));
        S.strikes[vi].push({t,vel:.8+.2*r3(),f:freq(note),tau,atk});
      }
    });
  }
  S.progText=chords.map(c=>c.name).join(' → ');
  S.keyText=NOTE[key]+' '+prog.mode;
  writeHash();
}
// midi pitch (float) of a voice at time t: opens from the shared pitch, then glides chord to chord
function pitchAt(v,t){
  const {fd,cd,g,n,f0}=S;
  const ft=fd*v.fk;
  if(t<ft)return f0+(v.m[0]-f0)*ease(t/ft);
  if(t<fd)return v.m[0];
  const i=Math.min(n-1,Math.floor((t-fd)/cd));
  if(i+1<n){const tg=fd+(i+1)*cd-g;if(t>tg){const a=v.m[i],b=v.m[i+1];return a+(b-a)*S.shape((t-tg)/g);}}
  return v.m[i];
}
// amplitude envelope of a struck voice at time t: the same shape the sound uses (fast attack, exponential decay)
function ampAt(vi,t){
  let a=0;
  for(const st of S.strikes[vi]){
    const x=t-st.t;if(x<0||x>st.atk+st.tau*8)continue;
    a+=st.vel*(x<st.atk?x/st.atk:Math.exp(-(x-st.atk)/st.tau));
  }
  return a*(vi===0?P.bass:1);
}
const chordIndexAt=t=>{let k=0;for(let i=0;i<S.n;i++)if(t>=S.fd+i*S.cd-S.g)k=i;return k;};

// ---------- drawing ----------
let T = 0, playing = false, frameNo = 0;
const FONT='"Helvetica Neue",Helvetica,Arial,sans-serif';

function render(ctx, w, h, time, frame, live) {
  const sc = Math.min(w, h) / 900;
  const m = { t: h*0.15, b: h*0.17 };
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#f4f2ec'; ctx.fillRect(0,0,w,h);
  const plotH=h-m.t-m.b,ink='#1b1b1d',cxp=w*0.5,pps=P.speed*sc;
  // side-scroll: the playhead sits mid-page, time flows right-to-left past it
  const X=t=>cxp+(t-time)*pps;
  const Y=p=>m.t+plotH*(1-(p-(S.lo-3))/(S.hi-S.lo+6));
  const cur=chordIndexAt(time);
  const tL=time-cxp/pps,tR=time+(w-cxp)/pps;
  ctx.lineCap='round';ctx.lineJoin='round';
  // time grid: a faint tick every second (stronger every 4), moving with the scroll
  ctx.lineWidth=Math.max(1,sc*.8);
  for(let t=Math.max(0,Math.ceil(tL));t<=Math.min(S.end,tR);t++){
    const x=X(t);ctx.strokeStyle=t%4===0?'#d2cec1':'#e6e2d7';
    ctx.beginPath();ctx.moveTo(x,m.t);ctx.lineTo(x,h-m.b);ctx.stroke();
  }
  // chord boundaries and names slide past
  ctx.font=`${11*sc}px ${FONT}`;ctx.textBaseline='alphabetic';ctx.textAlign='left';
  S.chords.forEach((c,i)=>{
    const x=X(S.fd+i*S.cd);if(x<-80*sc||x>w+10)return;
    ctx.strokeStyle='#c4c0b3';ctx.lineWidth=Math.max(1,sc);
    ctx.beginPath();ctx.moveTo(x,m.t*0.72);ctx.lineTo(x,h-m.b);ctx.stroke();
    ctx.fillStyle=i===cur?ink:'#9a968b';
    ctx.fillText(c.name,x+5*sc,m.t*0.62);
  });
  // playhead
  ctx.strokeStyle='rgba(27,27,29,.35)';ctx.lineWidth=Math.max(1,sc);
  ctx.setLineDash([3*sc,4*sc]);ctx.beginPath();ctx.moveTo(cxp,m.t*0.72);ctx.lineTo(cxp,h-m.b);ctx.stroke();ctx.setLineDash([]);
  // voice traces: history solid, upcoming path faint
  const t0=Math.max(0,tL),t1=Math.min(S.end,tR);
  const N=Math.max(60,Math.min(1600,Math.ceil(w/2)));
  let sumF=0,fmax=0,fmin=1e9;
  const path=(from,to)=>{
    ctx.beginPath();
    const n=Math.max(2,Math.ceil(N*(to-from)/Math.max(1e-6,t1-t0)));
    for(let i=0;i<=n;i++){const t=from+(to-from)*i/n;const x=X(t),y=Y(pitchAt(S.voices[path.v],t));i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.stroke();
  };
  S.voices.forEach((v,vi)=>{
    path.v=vi;
    if(time>t0){ctx.strokeStyle=ink;ctx.lineWidth=P.weight*sc*1.1;path(t0,time);}
    if(t1>time){ctx.strokeStyle='#bdb9ad';ctx.lineWidth=P.weight*sc*0.9;path(time,t1);}
    const pm=pitchAt(v,time),f=freq(pm),hy=Y(pm);
    sumF+=f;fmax=Math.max(fmax,f);fmin=Math.min(fmin,f);
    const amp=S.struck?Math.min(2,ampAt(vi,time)):0;
    ctx.fillStyle=ink;ctx.beginPath();ctx.arc(cxp,hy,4.6*sc*(1+P.pulse*amp),0,Math.PI*2);ctx.fill();
    if(v.label){
      const txt=f.toFixed(2)+' Hz';
      ctx.font=`${11.5*sc}px ${FONT}`;ctx.textBaseline='middle';
      const tw=ctx.measureText(txt).width;
      ctx.fillStyle='rgba(244,242,236,.88)';ctx.fillRect(cxp+8*sc,hy-8*sc,tw+8*sc,16*sc);
      ctx.fillStyle=ink;ctx.fillText(txt,cxp+12*sc,hy-1*sc);
    }
  });
  if(X(0)>0&&X(0)<w){ctx.fillStyle=ink;ctx.beginPath();ctx.arc(X(0),Y(S.f0),3*sc,0,Math.PI*2);ctx.fill();}

  // notes you play: they appear at the playhead the moment a key goes down and trail away to the left
  if(live){
    const rt=nowRT(),ac2='#d9480f',yMin=m.t,yMax=h-m.b;
    for(const n of liveShown){
      const te=n.rt1!==null?n.rt1:(n.struck?Math.min(rt,n.rt0+n.atk+n.tau*5):rt);
      const x0=cxp-(rt-n.rt0)*pps,x1=cxp-(rt-te)*pps;
      if(x1<-20)continue;
      const y=Math.max(yMin,Math.min(yMax,Y(n.midi)));
      ctx.strokeStyle=ac2;ctx.lineWidth=P.weight*sc*1.4;ctx.beginPath();ctx.moveTo(Math.max(-10,x0),y);ctx.lineTo(x1,y);ctx.stroke();
      if(liveSounding(n,rt)){
        const amp=n.struck?Math.min(2,liveAmp(n,rt)):0;
        ctx.fillStyle=ac2;ctx.beginPath();ctx.arc(cxp,y,4.6*sc*(1+P.pulse*amp),0,Math.PI*2);ctx.fill();
        ctx.font=`${11.5*sc}px ${FONT}`;ctx.textBaseline='middle';ctx.textAlign='left';
        const txt=n.f.toFixed(2)+' Hz  '+noteName(n.midi),tw=ctx.measureText(txt).width;
        ctx.fillStyle='rgba(244,242,236,.88)';ctx.fillRect(cxp+8*sc,y-8*sc,tw+8*sc,16*sc);
        ctx.fillStyle=ac2;ctx.fillText(txt,cxp+12*sc,y-1*sc);
      }
    }
  }
  // readouts
  const fs=11.5*sc,pad=Math.max(18*sc,w*0.025),lh=fs*1.55;
  ctx.font=`${fs}px ${FONT}`;ctx.textBaseline='alphabetic';ctx.fillStyle='#4a4842';
  const mm=Math.floor(time/60),ss=(time%60).toFixed(2).padStart(5,'0');
  const left=['f(n) = 440·2^((n−69)/12)',`voices ${S.voices.length}`,`t ${String(mm).padStart(2,'0')}:${ss}`,`frame ${String(frame).padStart(5,'0')}`];
  const right=[`key ${S.keyText} · ${S.prog.name}`,`chord ${S.chords[cur].name}`,`Σf ${sumF.toFixed(1)} Hz`,`f↑/f↓ ${(fmax/fmin).toFixed(4)}`,`motion ${Math.round(P.change*100)}%`,`seed 0x${S.seedNum.toString(16).toUpperCase().padStart(8,'0')}`];
  left.forEach((t,i)=>{ctx.textAlign='left';ctx.fillText(t,pad,h-pad-(left.length-1-i)*lh);});
  right.forEach((t,i)=>{ctx.textAlign='right';ctx.fillText(t,w-pad,h-pad-(right.length-1-i)*lh);});
  // progression line, shrunk to fit the space between the corner blocks
  let pf=fs;ctx.font=`${pf}px ${FONT}`;
  const room=w*0.42,tw=ctx.measureText(S.progText).width;
  if(tw>room){pf=pf*room/tw;ctx.font=`${pf}px ${FONT}`;}
  ctx.textAlign='center';ctx.fillStyle=ink;ctx.fillText(S.progText,w/2,h-pad);
  ctx.textAlign='left';
}

}
const wake=()=>{if(ac&&ac.state==='suspended')ac.resume();};
function replay(){T=0;frameNo=0;playing=true;rate=1;if(ac){wake();playChord(0);}}
// after a setting changes: restart if playing, otherwise just discard stale scheduled sound so Play reschedules it
function refresh(){if(playing)replay();else{stopSound();T=Math.min(T,S.end);}}
// VCR: pause suspends the audio clock, so the scheduled sound resumes exactly in sync; after any seek the
// sound is rescheduled from the new position
// Playing always (re)schedules the sound from the current position, and pausing simply fades it out. (An earlier
// version suspended the audio clock and reused the old schedule; after the piece ended, or after any setting change,
// that left Play running the picture with no sound.)
function resumeNormal(){
  rate=1;playing=true;if(T>=S.end)T=0;
  if(!ac)ensureAudio();
  wake();playChord(T);
}
function pauseIt(){playing=false;stopSound();}
function scan(r){
  if(rate===r&&playing){resumeNormal();return;}   // press again to go back to normal speed
  rate=r;playing=true;wake();stopSound();
}

// ---------- UI ----------
function randomSynth(){
  const R=Math.random,pick=a=>a[Math.floor(R()*a.length)],f=(a,b,d=2)=>+(a+R()*(b-a)).toFixed(d);
  const v={wave:pick(SELS.wave),glideShape:pick(SELS.glideShape),harm:f(0,.9),detune:Math.round(f(0,16,0)),cutoff:f(.45,1),reso:f(.4,4,1),
    vibRate:f(3,7,1),vibDepth:R()<.5?0:Math.round(f(3,18,0)),reverb:f(0,.65),bass:f(.6,1.5),decay:f(.8,5,1),bright:f(.2,.9),strum:Math.round(f(0,150,0)),sub:R()<.5?0:f(0,.7),sweep:R()<.6?0:f(.1,.6),sweepRate:f(.1,1.5),vol:.8,attack:f(.1,2),release:f(.6,3,1),glideLen:f(.4,1.6,1)};
  for(const k in v)setSyn(k,v[k]);
  syncPreset();
}
function randomize(){
  $('seed').value=newSeed();$('prog').value='auto';
  setSlider('voices',4+Math.floor(Math.random()*5));
  setSlider('labels',2+Math.floor(Math.random()*3));
  setSlider('weight',+(0.8+Math.random()*1.6).toFixed(1));
  setSlider('chordLen',+(2+Math.random()*2.5).toFixed(1));
  setSlider('change',+(0.2+Math.random()*0.8).toFixed(2));
  setSlider('jump',2+Math.floor(Math.random()*Math.random()*30));
  setSlider('cross',Math.random()<.5?36:Math.floor(Math.random()*6));
  setSlider('form',+(2+Math.random()*3).toFixed(1));
  randomSynth();
  build();replay();
}
$('snd').onclick=()=>{soundOn=!soundOn;$('snd').classList.toggle('on',soundOn);$('snd').innerHTML='&#9835; Sound: '+(soundOn?'on':'off');if(ac){if(soundOn){if(playing&&rate===1)playChord(T);}else stopSound();}};
$('vPlay').onclick=()=>{(playing&&rate===1)?pauseIt():resumeNormal();};
$('vRestart').onclick=()=>{const was=playing;T=0;if(ac){stopSound();wake();if(playing&&rate===1)playChord(0);}};
$('vRw').onclick=()=>scan(-4);
$('vFf').onclick=()=>scan(4);
$('vStop').onclick=()=>{playing=false;rate=1;T=0;wake();stopSound();};
$('scrub').addEventListener('input',e=>{scrubbing=true;T=+e.target.value;stopSound();});
$('scrub').addEventListener('change',e=>{scrubbing=false;T=+e.target.value;if(ac&&playing&&rate===1){wake();playChord(T);}});
addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('vPlay').click();}});
$('rand').onclick=randomize;
$('replay').onclick=replay;
$('newseed').onclick=()=>{$('seed').value=newSeed();build();replay();};
$('seed').addEventListener('change',()=>{build();refresh();});
$('prog').addEventListener('change',()=>{build();refresh();});
const UIKEY='nebula.ui.v1';
let uiState={};try{uiState=JSON.parse(localStorage.getItem(UIKEY)||'{}')||{};}catch(e){}
const saveUI=()=>{try{localStorage.setItem(UIKEY,JSON.stringify(uiState));}catch(e){}};
const setPanel=c=>{$('panel').classList.toggle('closed',c);$('tog').textContent=c?'+':'–';};
$('hd').onclick=()=>{const c=!$('panel').classList.contains('closed');setPanel(c);uiState.panelClosed=c;saveUI();};
if(uiState.panelClosed)setPanel(true);
// remember which sections are collapsed
document.querySelectorAll('details[data-sec]').forEach(d=>{
  const id=d.dataset.sec;if(id in uiState)d.open=!!uiState[id];
  d.addEventListener('toggle',()=>{uiState[id]=d.open;saveUI();});
});
$('png').onclick=()=>{
  const v=$('exp').value;let w,h;
  if(v==='4k'){w=3840;h=2160;}else{w=Math.round(cv.clientWidth*+v);h=Math.round(cv.clientHeight*+v);}
  const oc=document.createElement('canvas');oc.width=w;oc.height=h;
  render(oc.getContext('2d'),w,h,S.end,Math.floor(S.end*60));
  oc.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download=`nebula-${$('seed').value}-c${Math.round(P.change*100)}-${w}x${h}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);},'image/png');
};
addEventListener('resize',fit);
// browsers only allow audio after a user gesture: the first click or key press anywhere unlocks it
const unlock=()=>{if(!ac)ensureAudio();else wake();started=true;};
addEventListener('pointerdown',unlock,true);addEventListener('keydown',unlock,true);

$('seed').value=newSeed();
$('preset').value='Warm pad (default)';
try{const q=new URLSearchParams(location.hash.slice(1));
  if(!q.get('seed')){
    const st=JSON.parse(localStorage.getItem(AUTOSAVE)||'null');   // no settings in the URL: restore the last session
    if(st)applyConfig(st,false);
  }
  if(q.get('seed'))$('seed').value=q.get('seed');
  if(q.get('prog'))$('prog').value=q.get('prog');
  for(const [k] of SL){if(q.has(k)){const i=$('s_'+k);i.value=q.get(k);i.dispatchEvent(new Event('input'));}}
  for(const k of [...SYN.map(x=>x[0]),...Object.keys(SELS)])if(q.has(k))setSyn(k,q.get(k));}catch(e){}
syncPreset();
fit();build();
window.__nebula={presetDiff:n=>{const f=presetValues(n),o=[];for(const k in f){const want=typeof f[k]==='number'?snap(k,f[k]):f[k];if(typeof want==='number'?Math.abs(want-P[k])>=1e-3:want!==P[k])o.push([k,f[k],want,P[k]]);}return o;},get S(){return S;},pitchAt,ampAt,get T(){return T;},get playing(){return playing;},liveShown,liveNotes,kbLayout};
requestAnimationFrame(t=>{last=t;tick(t);});
})();
</script>
